name: Track Performance

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: performance-benchmark
  cancel-in-progress: true

env:
  UV_VERSION: '0.12.3'

jobs:
  benchmark:
    name: CPU hot paths / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Run benchmarks and compare with the previous retained result
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/benchmark_ci.py

      - name: Validate and print results
        run: uv run --no-sync python -m json.tool benchmark.json

      - name: Upload benchmark result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-hotpaths-${{ github.sha }}
          path: benchmark.json
          if-no-files-found: error
          retention-days: 30
