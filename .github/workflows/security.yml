name: Scheduled Security Audit

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  UV_VERSION: '0.12.3'

jobs:
  audit:
    name: Dependencies and source / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install audit tools
        run: uv sync --locked --only-group security

      - name: Audit locked runtime and ML dependencies
        shell: bash
        run: |
          uv export --locked --no-dev --group security --extra ml --no-hashes --no-emit-project > audited-requirements.txt
          uv run --no-sync python -m pip_audit --requirement audited-requirements.txt --disable-pip --no-deps

      - name: Reject high-severity source findings
        run: uv run --no-sync python -m bandit -q -r cdskit -lll
