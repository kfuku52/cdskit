name: Scheduled Security Audit

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  audit:
    name: Dependencies and source / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup.py

      - name: Install current supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ml,security]"

      - name: Audit resolved dependencies
        run: python -m pip_audit --local --skip-editable

      - name: Reject high-severity source findings
        run: python -m bandit -q -r cdskit -lll
