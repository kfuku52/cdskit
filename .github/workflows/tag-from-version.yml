name: Create major/minor release from version

on:
  workflow_run:
    workflows: [Run Tests]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/heads/master

      - name: Verify checkout is the tested commit
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if [ "$CHECKED_OUT_SHA" != "$TESTED_SHA" ]; then
            echo "master moved after the tested run: checked out $CHECKED_OUT_SHA, tested $TESTED_SHA."
            echo "The newer master run will perform the release after it succeeds."
            exit 1
          fi

      - name: Read and classify version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import ast, pathlib; tree=ast.parse(pathlib.Path("cdskit/__init__.py").read_text()); values=[ast.literal_eval(node.value) for node in ast.walk(tree) if isinstance(node, ast.Assign) and any(getattr(target, "id", None) == "__version__" for target in node.targets)]; print(values[0] if len(values) == 1 else "")')
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a semantic version in cdskit/__init__.py, got: $VERSION"
            exit 1
          fi

          SHOULD_RELEASE=false
          if (( 10#${BASH_REMATCH[3]} == 0 )); then
            SHOULD_RELEASE=true
          fi

          {
            echo "version=$VERSION"
            echo "tag=$VERSION"
            echo "should_release=$SHOULD_RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Skip patch-only version
        if: steps.version.outputs.should_release != 'true'
        run: echo "${{ steps.version.outputs.version }} is a patch-only version; no tag or GitHub Release will be created."

      - name: Create annotated tag
        if: steps.version.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          EXPECTED=$(git rev-parse HEAD)
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            ACTUAL=$(git rev-list -n 1 "$TAG")
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "Tag $TAG already points to $ACTUAL, expected $EXPECTED."
              exit 1
            fi
            echo "Tag $TAG already points to the tested commit."
          else
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG" "$EXPECTED" -m "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
