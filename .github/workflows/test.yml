name: Run Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.10'}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-latest, python-version: '3.14'}
          - {os: macos-latest, python-version: '3.12'}
          - {os: macos-latest, python-version: '3.14'}
          - {os: windows-latest, python-version: '3.12'}
          - {os: windows-latest, python-version: '3.14'}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Test core suite
        run: python -m pytest -q tests/unit tests/integration -m "not ml" --durations=20 --durations-min=0.05

  ml-coverage:
    name: ML and coverage / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup.py

      - name: Install test and ML dependencies
        run: python -m pip install -e ".[test,coverage,ml]"

      - name: Test with coverage
        run: python -m pytest -q -n 2 --dist=worksteal --cov=cdskit --cov-report=term-missing --cov-fail-under=70 --durations=20 --durations-min=0.05

  quality:
    name: Ruff and mypy / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup.py

      - name: Install quality dependencies
        run: python -m pip install -e ".[quality]"

      - name: Lint
        run: python -m ruff check cdskit scripts tests

      - name: Type check
        run: python -m mypy cdskit/*.py --ignore-missing-imports --explicit-package-bases

  package:
    name: Build and wheel / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup.py

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build distributions
        run: python -m build

      - name: Validate wheel installation
        shell: bash
        run: |
          python -m venv /tmp/cdskit-wheel
          /tmp/cdskit-wheel/bin/python -m pip install dist/*.whl
          /tmp/cdskit-wheel/bin/cdskit --version
          /tmp/cdskit-wheel/bin/python -m pip check
