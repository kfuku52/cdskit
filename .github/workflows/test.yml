name: Run Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  UV_VERSION: '0.12.3'

jobs:
  test:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"macos-latest","python-version":"3.14"},{"os":"windows-latest","python-version":"3.14"}]' || '[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"macos-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.14"},{"os":"windows-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.14"}]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked --no-dev --group test

      - name: Test core suite
        run: uv run --no-sync python -m pytest -q tests/unit tests/integration -m "not ml" --durations=20 --durations-min=0.05

  ml-coverage:
    name: ML and coverage / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test, ML, and security dependencies
        run: uv sync --locked --no-dev --group test --group coverage --group security --extra ml

      - name: Test with coverage
        run: uv run --no-sync python -m pytest -q -n 2 --dist=worksteal --cov=cdskit --cov-report=term-missing --cov-report=json:coverage.json --durations=20 --durations-min=0.05

      - name: Check critical module coverage floors
        run: uv run --no-sync python scripts/check_coverage.py coverage.json

      - name: Audit resolved dependencies
        run: uv run --no-sync python -m pip_audit --local --skip-editable

  quality:
    name: Ruff and mypy / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install quality and security dependencies
        run: uv sync --locked --only-group quality --only-group security

      - name: Lint
        run: uv run --no-sync python -m ruff check cdskit scripts tests

      - name: Format
        run: uv run --no-sync python -m ruff format --check cdskit scripts tests

      - name: Type check
        run: uv run --no-sync python -m mypy cdskit

      - name: Reject new high-severity security findings
        run: uv run --no-sync python -m bandit -q -r cdskit -lll

      - name: Guard maximum cyclomatic complexity
        run: uv run --no-sync python -m ruff check cdskit --select C901

  package:
    name: Build and wheel / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install build dependencies
        run: uv sync --locked --only-group build

      - name: Build distributions
        run: uv run --no-sync python -m build

      - name: Validate wheel installation
        shell: bash
        run: |
          uv venv /tmp/cdskit-wheel --python python
          uv pip install --python /tmp/cdskit-wheel/bin/python dist/*.whl
          /tmp/cdskit-wheel/bin/cdskit --version
          printf '>wheel-smoke\nATGA\n' | /tmp/cdskit-wheel/bin/cdskit pad | grep -q '^ATGANN$'
          /tmp/cdskit-wheel/bin/cdskit plot --seq_file tests/fixtures/example_plot.fasta --out_file /tmp/cdskit-wheel/smoke.svg --format svg
          test -s /tmp/cdskit-wheel/smoke.svg
          uv pip check --python /tmp/cdskit-wheel/bin/python
