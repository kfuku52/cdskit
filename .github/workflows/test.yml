name: Run Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.10'}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-latest, python-version: '3.14'}
          - {os: macos-latest, python-version: '3.12'}
          - {os: macos-latest, python-version: '3.14'}
          - {os: windows-latest, python-version: '3.12'}
          - {os: windows-latest, python-version: '3.14'}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Test core suite
        run: python -m pytest -q tests/unit tests/integration -m "not ml" --durations=20 --durations-min=0.05

  ml-coverage:
    name: ML and coverage / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup.py

      - name: Install test, ML, and security dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,coverage,ml,security]"

      - name: Test with coverage
        run: python -m pytest -q -n 2 --dist=worksteal --cov=cdskit --cov-report=term-missing --cov-fail-under=75 --durations=20 --durations-min=0.05

      - name: Audit resolved dependencies
        run: python -m pip_audit --local --skip-editable

  quality:
    name: Ruff and mypy / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup.py

      - name: Install quality and security dependencies
        run: python -m pip install -e ".[quality,security]"

      - name: Lint
        run: python -m ruff check cdskit scripts tests

      - name: Type check
        run: python -m mypy cdskit/*.py --ignore-missing-imports --explicit-package-bases

      - name: Reject new high-severity security findings
        run: python -m bandit -q -r cdskit -lll

      - name: Guard maximum cyclomatic complexity
        run: python -m ruff check cdskit --select C901 --config lint.mccabe.max-complexity=38

  package:
    name: Build and wheel / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup.py

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build distributions
        run: python -m build

      - name: Validate wheel installation
        shell: bash
        run: |
          python -m venv /tmp/cdskit-wheel
          /tmp/cdskit-wheel/bin/python -m pip install dist/*.whl
          /tmp/cdskit-wheel/bin/cdskit --version
          /tmp/cdskit-wheel/bin/python -m pip check
