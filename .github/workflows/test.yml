name: Run Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.10'}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-latest, python-version: '3.14'}
          - {os: macos-latest, python-version: '3.12'}
          - {os: macos-latest, python-version: '3.14'}
          - {os: windows-latest, python-version: '3.12'}
          - {os: windows-latest, python-version: '3.14'}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest

  full:
    name: ML, coverage, quality, and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install all test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,ml]"

      - name: Lint
        run: python -m ruff check cdskit scripts tests

      - name: Type check
        run: python -m mypy cdskit/*.py --ignore-missing-imports --explicit-package-bases

      - name: Test with coverage
        run: python -m pytest --cov=cdskit --cov-report=term-missing --cov-fail-under=70

      - name: Build distributions
        run: python -m build

      - name: Validate wheel installation
        shell: bash
        run: |
          python -m venv /tmp/cdskit-wheel
          /tmp/cdskit-wheel/bin/python -m pip install dist/*.whl
          /tmp/cdskit-wheel/bin/cdskit --version
          /tmp/cdskit-wheel/bin/python -m pip check
